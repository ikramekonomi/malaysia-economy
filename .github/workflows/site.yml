# The public site (site/): builds its data from core/ (apps/site/build_site_data.py) and publishes site/ to GitHub
# Pages. One-time setup: Settings -> Pages -> Source: "GitHub Actions". site/data is never committed: it is rebuilt here.
name: Site

on:
  push:
    branches: [main]
    paths: ["core/**", "meta/**", "site/**", "apps/site/**", ".github/workflows/site.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build the site's data from core/
        run: python3 apps/site/build_site_data.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
